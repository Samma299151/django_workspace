{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" type="text/css" href="{% static 'app/css/style.css' %}"/>
</head>
<body>
    <div class="header">
        {{mainTitle}}
    </div>

    <div class="title">
        {{title}}
    </div>
        
    <div class="content">
        <!-- メニューボタン管理 -->
        <div class="left-menu">
            <button onclick="location.href='{% url 'CustomerManagementMenu' %}'" name="CustomerManagementMenuButton">
                得意先管理メニュー
            </button>
            <br>
            <button onclick="location.href='{% url 'Logout' %}'" name="logoutButton">
                ログアウト
            </button>        
        </div>

        <!-- 検索フォーム -->
        <div class="search-area">
            <form action="{% url 'CustomerSearch' %}" method="post">
                {% csrf_token %}
                <tr>
                    {{form.as_table}}
                    <td></td>
                    <td><button type="submit">検索</button></td>
                </tr>
            </form>
        </div>
    </div>
</body>
</html>
